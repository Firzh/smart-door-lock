<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Smart Door Lock</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="login-page">
  <main class="login-container">
    <section class="panel login-card">
      <div class="login-header">
        <div class="brand-mark">SDL</div>
        <h1>Smart Door Lock</h1>
        <p class="text-muted">Masuk untuk mengelola akses pintu &amp; kartu RFID</p>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            class="form-control"
            placeholder="admin@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-control"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          />
        </div>

        <button id="login-submit" type="submit" class="btn btn-primary btn-block">
          Masuk
        </button>
      </form>
    </section>
  </main>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Supabase SDK (Pinned CDN version) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
